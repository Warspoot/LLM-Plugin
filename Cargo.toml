[package]
name = "llm_plugin"
version = "0.1.0"
edition = "2021"
description = "LLM-based auto-translation plugin for Hachimi-Edge"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
ureq = { version = "3.2.0", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
